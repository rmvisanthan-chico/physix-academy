# PhysiX Academy — Simulation Health Audit (CI gate)
#
# WHAT THIS IS
# The registry-wide audit from Phase 3C.1 (tools/audit-sims.mjs) runs on every
# push and pull request. It mounts all 51 registered simulations and checks
# observable MOVEMENT - pixels change, the physics clock advances, graphs receive
# samples, loops stop on unmount - rather than checking that elements exist.
#
# This exists because a simulation can render perfectly and still be completely
# dead. "Charge in a B Field" did exactly that for months: header, sliders,
# readouts, canvas, all present, and a ReferenceError on mount meant the loop
# never started. Only a check that looks for evidence of running finds that.
#
# MERGE BLOCKING
# This workflow does NOT block merges by itself. It is only a gate once this
# check is marked "required" in the repository's branch protection rules.
#
#   Settings -> Branches -> Branch protection rules -> main
#     -> "Require status checks to pass before merging"
#     -> add status check:  "Simulation Health Audit"
#
# That is the JOB NAME, which is what the dropdown lists. The Checks tab shows the
# same run in context as "Simulation Health Audit / simulation-health-audit"
# (workflow / job id) - select the plain job name from the dropdown.
#
# This setting cannot be applied from a clone and is deliberately NOT done
# automatically here: quietly turning on required checks changes what everyone
# can merge, and that is the repository owner's decision to make knowingly.
#
# SECURITY
# No secrets are read and no environment values are printed. The job runs with
# read-only repository permissions on untrusted PR code.

name: Simulation Health Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One audit at a time. The audit is a ~5 minute browser run; overlapping copies of
# the same sweep waste runner minutes and, because they drive a browser against
# local ports, can interfere with each other's results. In-flight runs for the
# same ref are queued rather than duplicated. Cancellation is explicit so a push
# that supersedes a PR run actually stops it.
concurrency:
  group: sim-health-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# A hung browser should not consume a runner for six hours.
timeout-minutes: 30

jobs:
  simulation-health-audit:
    # The job name is what branch protection matches on, so it is deliberately
    # identical to the workflow name: the required check is simply
    # "Simulation Health Audit". If you rename one, rename both.
    name: Simulation Health Audit
    runs-on: ubuntu-latest
    env:
      # Provision our own browser instead of relying on whatever Chrome a runner
      # image happens to ship. tools/audit-sims.mjs defaults to 'chrome' for
      # local development, so nothing changes on a developer's machine.
      PW_CHANNEL: chromium
      AUDIT_PORT_LOCAL: 4311
      AUDIT_PORT_BUNDLED: 4312
      CI: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      # Deliberately NOT a bare `npm install` in the repo.
      #
      # package.json declares electron + electron-builder as devDependencies, so
      # installing in place drags in several hundred megabytes of desktop-packaging
      # tooling that a headless browser audit never touches. Installing into a
      # prefix outside the repository means npm sees no devDependencies at all and
      # installs exactly these two packages: ~39MB instead of ~300MB.
      #
      # Three flags, each for a specific reason:
      #   --no-save          do not rewrite package.json
      #   --no-package-lock  do not create/regenerate package-lock.json, which is
      #                      currently untracked work-in-progress here and must not
      #                      be regenerated by CI tooling
      #   --ignore-scripts   no postinstall side effects on a runner
      #
      # Verified locally before being committed: with --prefix alone, vite was
      # silently dropped by --omit=dev, and two sequential --no-save installs
      # pruned each other, because the second reconcile discarded anything not in
      # package.json. One combined install into an empty prefix is the form that
      # actually works.
      - name: Install audit dependencies
        run: |
          set -euo pipefail
          DEPS="${RUNNER_TEMP}/ci-deps"
          mkdir -p "$DEPS"
          printf '{"name":"ci-deps","private":true}\n' > "$DEPS/package.json"
          npm install --prefix "$DEPS" \
            --no-save --no-package-lock --ignore-scripts \
            playwright@1.63.0 vite@7.3.6
          echo "NODE_PATH=${DEPS}/node_modules" >> "$GITHUB_ENV"

          # Install the browser from the tree we just created. This calls the
          # binary directly instead of `npx --prefix`, which is not a real npx
          # flag - the first version of this workflow used it and the run failed.
          "$DEPS/node_modules/.bin/playwright" install --with-deps chromium

          NODE_PATH="${DEPS}/node_modules" \
            node -e "require('playwright');require('vite');console.log('playwright + vite resolve OK')"

      - name: Run the simulation health audit
        run: node tools/ci-run-audit.mjs

      # The audit exits non-zero on a real regression, so the job fails on its
      # own. This step exists purely to make the diagnosis obvious in the log
      # rather than leaving a reader to scroll back through browser output.
      - name: Explain a failure
        if: failure()
        run: |
          echo "::error title=Simulation health audit failed::"
          echo "A registered simulation failed its health checks."
          echo ""
          echo "The step log above names the simulation and the specific check."
          echo "Common causes, in the order they actually occur:"
          echo "  - a simulation mounts but its loop never advances state"
          echo "  - a control is present but wired to nothing"
          echo "  - an animation loop survives unmount (leaks across navigation)"
          echo "  - a regression in the Graph Engine or the shared time controls"
          echo ""
          echo "Reproduce locally:  node tools/ci-run-audit.mjs"
          echo "Verify the checker still detects breakage:  node tools/audit-sims.mjs http://127.0.0.1:4311 --self-test"