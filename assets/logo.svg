<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#070b16" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Background wave graph bottom-left -->
  <path d="M16 88 L36 88 M26 76 L26 100" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="2 2"/>
  <path d="M14 88 C 18 78, 22 78, 26 88 C 30 98, 34 98, 38 88" fill="none" stroke="#2563eb" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>

  <!-- Sparkles top-right -->
  <path d="M102 24 L104 30 L110 32 L104 34 L102 40 L100 34 L94 32 L100 30 Z" fill="#38bdf8" opacity="0.85"/>
  <path d="M90 42 L91 45 L94 46 L91 47 L90 50 L89 47 L86 46 L89 45 Z" fill="#38bdf8" opacity="0.5"/>

  <!-- Orbital Ring 1 (back) -->
  <ellipse cx="64" cy="64" rx="48" ry="20" fill="none" stroke="url(#orbitGrad)" stroke-width="2" transform="rotate(-25 64 64)" stroke-dasharray="120 40"/>

  <!-- The Bold Letter P -->
  <path d="M48 30 
           H 64 
           C 82 30, 94 40, 94 58 
           C 94 76, 82 86, 64 86 
           H 54 
           V 98 
           H 48 
           Z
           M 54 36
           V 80
           H 63
           C 77 80, 87 73, 87 58
           C 87 43, 77 36, 63 36
           Z" fill="url(#pGrad)"/>

  <!-- Top stem dot -->
  <circle cx="51" cy="22" r="5" fill="#38bdf8"/>
  <circle cx="51" cy="22" r="9" fill="url(#glow)" opacity="0.7"/>

  <!-- Orbital Ring 2 (front with electron) -->
  <ellipse cx="64" cy="64" rx="52" ry="22" fill="none" stroke="url(#orbitGrad)" stroke-width="3" transform="rotate(-25 64 64)" stroke-dasharray="180 80" stroke-dashoffset="30"/>

  <!-- Electron Sphere on Orbit -->
  <circle cx="92" cy="74" r="5.5" fill="#38bdf8"/>
  <circle cx="92" cy="74" r="9" fill="url(#glow)"/>
  <circle cx="90.5" cy="72.5" r="1.5" fill="#ffffff" opacity="0.9"/>

  <!-- Mini Atom bottom-right -->
  <g transform="translate(92 92) scale(0.35)">
    <circle cx="0" cy="0" r="8" fill="#38bdf8"/>
    <ellipse cx="0" cy="0" rx="25" ry="10" fill="none" stroke="#2563eb" stroke-width="2.5" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="25" ry="10" fill="none" stroke="#38bdf8" stroke-width="2.5" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="25" ry="10" fill="none" stroke="#93c5fd" stroke-width="2.5" transform="rotate(90)"/>
    <circle cx="21" cy="12" r="4" fill="#38bdf8"/>
    <circle cx="-21" cy="-12" r="4" fill="#2563eb"/>
  </g>
</svg>
