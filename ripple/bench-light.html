<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ripple tank bench</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>.rt .iso-plate {
  overflow: hidden;
}

.rt {
  --rt-sheet: #1d1d1d;
  --rt-tape: #232323;
}

.iso[data-theme="light"] .rt,
.rt[data-theme="light"] {
  --rt-sheet: #ffffff;
  --rt-tape: #f1f1ee;
}

.rt-stage {
  position: relative;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  cursor: crosshair;
}

.rt-stage[data-gl] .rt-fallback {
  display: none;
}

.rt-said {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.rt-stage:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 6px;
}

.rt-stage > svg,
.rt-stage > canvas {
  display: block;
  width: 100%;
  height: auto;
}

.rt-stage > .rt-layer {
  position: absolute;
  inset: 0;
  height: 100% !important;
  pointer-events: none;
}

.iso:not([data-theme="light"]) .rt-paper-gl {
  mix-blend-mode: screen;
}

.rt-sheet > .iso-fill {
  fill: var(--rt-sheet);
}

.rt-tape > .iso-fill {
  fill: var(--rt-tape);
}

.rt-water > .iso-fill {
  fill: var(--anatomy-shade-2);
  opacity: calc(0.7 * (1 - var(--rt-lamp, 0)));
}

.iso[data-theme="light"] .rt-stage[data-gl] .rt-water > .iso-fill,
.rt[data-theme="light"] .rt-stage[data-gl] .rt-water > .iso-fill {
  opacity: 0;
}

.rt-lever {
  stroke-width: 1.4;
}

@media (max-width: 560px) {
  .rt .iso-plate {
    padding: 48px 6px 70px;
  }
}

@media (max-width: 560px) {
  .rt-stage {
    width: 118%;
    margin: -8% -9% -4%;
  }

  .rt-stage:focus-visible {
    outline: none;
  }

  .rt .iso-plate:has(.rt-stage:focus-visible) {
    outline: 1px solid var(--anatomy-muted);
    outline-offset: 4px;
  }
}

/* PhysiX Academy brand */
.iso {
  --anatomy-red: #fb7185;
  --anatomy-blue: #22d3ee;
  --anatomy-green: #34d399;
  --anatomy-hi: #e6f1ff;
  --anatomy-mid: #7f8db3;
  --anatomy-lo: #3a4668;
  --anatomy-page: #070b16;
  --anatomy-card: #0a1020;
}

.iso-plate {
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(109, 93, 246, 0.14), transparent 55%),
    radial-gradient(900px 500px at -10% 25%, rgba(34, 211, 238, 0.1), transparent 50%),
    #070b16 !important;
}

.iso[data-theme="light"] .iso-plate {
  background: radial-gradient(1000px 460px at 28% 18%, #f3e9d2 0%, #fbfbfa 55%) !important;
}

ge and vibrating bar</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>The paper, 10.9 cm down: the pattern 1.64× life size</span></span><span class="iso-caption">A ripple tank seen by strobe light. Two dippers on one vibrating bar touch 6 mm of water in phase; the lamp flashes 0.75 times a second slower than they dip, so each wave seems to crawl outward at 0.75 Hz, which is honest slow motion. Ripples this small are held flat by surface tension as well as gravity, ω² = (gk + σk³/ρ) tanh kh, so at 16 Hz the wavelength is 1.45 cm and a crest travels 23 cm/s. Wherever the paths from the two dippers differ by half a wavelength the waves cancel, so dippers d apart draw 2⌊d/λ + ½⌋ nodal lines: 6 at 5 cm. A crest one wavelength out stands only 0.069 mm high (ka = 0.03), yet it is a weak lens. The lamp is 17.1 cm above the water and the paper 10.9 cm below it, so the shadow is 1.64 times life size and the paper sits 0.28 of a crest's focal length down at 16 Hz, 0.45 at 28 Hz. Near the dippers, where the two waves add, the light passes through focus and every crest draws a sharp bright line, and the plain grey bands that break them are the nodal lines. A sloped foam beach inside the walls soaks up each wave before it can reflect. The damping here is clean water's viscosity alone, so these ripples carry farther than in a real tank, where a surface film calms them sooner.</span></figcaption></figure></div></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];

    float rw=max(.45,1.2*soft);
    float rc=uContact+rw;
    float ring=(exp(-pow((length(s.xy-uS1)-rc)/rw,2.))+exp(-pow((length(s.xy-uS2)-rc)/rw,2.)))*(.45/rw);
    float lift=uPale>.5?max(refl-flat0,0.)/.15:refl;
    float sink=uPale>.5?max(flat0-refl,0.)/.74:0.;
    add+=(lift+ring*.12)*wet;
    tint+=(uTint+sink+ring*.05)*wet;
  }
  float pz=px/uCam.w;
  float sz=.7*pz;
  vec3 bx=onWallX(vb,uNear.x);
  vec3 by=onWallY(vb,uNear.y);
  float alongX=window(bx.y,uIn.y,uIn.w,.7*px/uCam.y);
  float alongY=window(by.x,uIn.x,uIn.z,.7*px/uCam.x);
  float bandX=window(bx.z,uFloor,uZ.z,sz)*alongX;
  float bandY=window(by.z,uFloor,uZ.z,sz)*alongY;
  float band=max(bandX,bandY);
  vec3 fx=onWallX(vb,uIn.x);
  vec3 fy=onWallY(vb,uIn.y);
  float glass=max(window(bx.z,uZ.z,uRim,sz)*alongX,window(by.z,uZ.z,uRim,sz)*alongY);
  glass=max(glass,max(window(fx.z,uZ.z,uRim,sz)*window(fx.y,uIn.y,uIn.w,.7*px/uCam.y),window(fy.z,uZ.z,uRim,sz)*window(fy.x,uIn.x,uIn.z,.7*px/uCam.x)));
  add+=glass*uGlass.x;
  tint+=glass*uGlass.y;
  float lw=max(.45,.9*pz);
  float lip=max(lineAt(bx.z,uZ.z+.5,lw)*alongX,lineAt(by.z,uZ.z+.5,lw)*alongY)*1.2;
  float sole=max(lineAt(bx.z,uFloor+.3,lw)*alongX,lineAt(by.z,uFloor+.3,lw)*alongY)*1.2;
  add+=band*uWall.x+(lip+sole*.35)*uWall.z;
  tint+=band*uWall.y+(lip+sole*.35)*uWall.w;
  if(uPale<.5)add+=tonemap(vec3(beamAt(vb)*.16),1.).r*.9;
  add=max(add,0.);tint=clamp(tint,0.,.9);
  float a=add+tint;
  float over=max(a,1.);
  vec3 ink=uInk;
  vec3 c=dither(vec3(add)+ink*tint)/over;
  gl_FragColor=vec4(c,a/over)*uLight;
}`;

const FIXED = {
  uReach: D.reach,
  uSlope: D.slope,
  uCaustic: D.optics.caustic,
  uMag: D.optics.magnification,
  uIn: D.inside,
  uBeach: D.beach,
  uZ: D.z,
  uPale: pale ? 1 : 0,
  uBed: D.bed,
  uFloor: D.floor,
  uOut: D.outside,
  uLamp: D.lamp,
  uLampR: D.lampR,
  uBlur: D.blur,
  uPaper: D.paper,
  uBase: D.base,
  uRound: D.round,
  uLegs: D.legs,
  uPost: D.post,
  uBar: D.bar,
  uBeam: D.beam,
  uMotor: D.motor,
  uHigh: D.high,
  uBox: D.box,
  uBoxTop: D.boxTop,
  uNear: D.near,
  uContact: D.contact,
  uSpread: D.spread,
  uFoam: D.foam,
  uLo: PACK.map(([low]) => low),
  uSpan: PACK.map(([low, high]) => high - low),
  uExpo: pale ? [0.3, 0.7, 2.4] : [0.55, 0, 0],
  uEnv: pale ? [0.3, 1, 0, 0.02] : [0.04, 6, 0.3, 0.02],
  uGlass: pale ? [0, 0.05] : [0.02, 0.03],
  uGlint: pale ? [0.035, 0.006, 3] : [0.035, 0.006, 26],
  uRim: D.rim,
  uTop: D.top,
  uTint: pale ? 0.06 : 0.08,
  uWall: pale ? [0, 0.2, 0, 0.45] : [0.05, 0.16, 0.5, 0],
  uInk: pale ? [0.11, 0.11, 0.12] : [0.02, 0.025, 0.03],
};
const NAMES = ["uS1", "uS2", "uPhase", "uHist", "uIG", "uKNow", "uStep", "uLight"];
const paperLayer = glLayer({ canvas: paperCanvas, fragment: PAPER_GLSL, view: [D.W, D.H], camera: D.camera, uniforms: NAMES, fixed: FIXED, extensions: ["GL_OES_standard_derivatives"] });
const waterLayer = paperLayer ? glLayer({ canvas: waterCanvas, fragment: WATER_GLSL, view: [D.W, D.H], camera: D.camera, uniforms: NAMES, fixed: FIXED }) : null;
const lit = !!(paperLayer && waterLayer);
const bytes = new Uint8Array(HIST * 2 * 4);
const textures = lit ? [paperLayer, waterLayer].map(textureOf) : [];
if (lit) stage.setAttribute("data-gl", "");

const FR = D.range.frequency;
const SR = D.range.spacing;
const freq = { x: D.start.frequency, v: 0 };
const gap = { x: D.start.spacing, v: 0 };
const state = { tf: D.start.frequency, td: D.start.spacing, phase: D.phase, lamp: 0, lampClock: 0, clock: 0, pushed: 0, step: 0 };
let model = stateOf(freq.x, gap.x, D.optics);
const history = { k: new Float64Array(HIST), phi: new Float64Array(HIST), omega: new Float64Array(HIST), decay: new Float64Array(HIST), slow: new Float64Array(HIST), at: new Float64Array(HIST) };
let phi = 0;
let touring = !still.matches;
let tourClock = -1.4;
let tourFrom = { f: freq.x, d: gap.x };
let idleTimer = 0;
let sayTimer = 0;
let visible = false;
let frame = 0;
let last = 0;
let dirty = true;
let drawn = "";

const angleOf = (f) => ((-135 + (270 * (f - FR[0])) / (FR[1] - FR[0])) * Math.PI) / 180;
const angleOfD = (d) => ((-135 + (270 * (d - SR[0])) / (SR[1] - SR[0])) * Math.PI) / 180;

function tourAt(time) {
  const f = 17 + 8.5 * Math.sin((time * TAU) / 28 - 0.3);
  const d = 50 + 25 * Math.sin((time * TAU) / 16 + 0.2);
  const blend = smooth(0, 1, time / 2.4);
  return { f: tourFrom.f + (f - tourFrom.f) * blend, d: tourFrom.d + (d - tourFrom.d) * blend };
}

function announce() {
  clearTimeout(sayTimer);
  sayTimer = setTimeout(() => {
    const words = wordsOf(stateOf(state.tf, state.td, D.optics));
    if (said.textContent !== words) said.textContent = words;
  }, 700);
}

function record(slot) {
  history.k[slot] = model.kMm;
  history.phi[slot] = phi;
  history.omega[slot] = TAU * model.frequency;
  history.decay[slot] = model.decay;
  history.slow[slot] = 1 / (model.group * 1000);
  history.at[slot] = state.clock;
}

function remember(dt, calm) {
  state.clock += dt;
  phi += TAU * model.frequency * dt;
  if (calm) {
    for (let slot = 0; slot < HIST; slot++) record(slot);
    state.pushed = state.clock;
    return;
  }
  while (state.clock - state.pushed >= D.histDt) {
    state.pushed += D.histDt;
    for (const list of Object.values(history)) list.copyWithin(1, 0, HIST - 1);
  }
  record(0);
}

function put(index, value, [low, high]) {
  const code = Math.round(clampTo((value - low) / (high - low), 0, 1) * 65535);
  bytes[index] = code >> 8;
  bytes[index + 1] = code & 255;
}

function packHistory() {
  for (let slot = 0; slot < HIST; slot++) {
    const lag = phi - history.phi[slot] - history.omega[slot] * (state.clock - history.at[slot]);
    put(slot * 4, history.k[slot], PACK[0]);
    put(slot * 4 + 2, slot ? lag : 0, PACK[1]);
    put((HIST + slot) * 4, history.decay[slot], PACK[2]);
    put((HIST + slot) * 4 + 2, history.slow[slot], PACK[3]);
  }
  for (const [index, layer] of [paperLayer, waterLayer].entries()) {
    const gl = layer.gl;
    gl.bindTexture(gl.TEXTURE_2D, textures[index]);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, HIST, 2, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
  }
}

function drawFallback() {
  if (lit) return;
  const key = `${freq.x.toFixed(2)}|${gap.x.toFixed(1)}`;
  if (key === drawn) return;
  drawn = key;
  const pattern = patternOf(model, D.pattern, (point) => iso(point, D.P), D.phase);
  crestPath.setAttribute("d", pattern.crests);
  nodalPath.setAttribute("d", pattern.nodal);
}

function drawSvg() {
  const half = gap.x / 2;
  const bob = model.amplitude * Math.sin(state.phase);
  farDipper.setAttribute("transform", translateAlong(D.P, [0, -half, bob]));
  nearDipper.setAttribute("transform", translateAlong(D.P, [0, half, bob]));
  bar.setAttribute("transform", translateAlong(D.P, [0, 0, bob]));
  motor.setAttribute("transform", translateAlong(D.P, [0, 0, bob]));
  const a = angleOf(freq.x);
  knobF.setAttribute("d", lineOnTop([D.knobF[0] + Math.sin(a) * 1, D.knobF[1] - Math.cos(a) * 1], [D.knobF[0] + Math.sin(a) * 3.8, D.knobF[1] - Math.cos(a) * 3.8], D.knobTop + 0.4, D.P));
  const ad = angleOfD(gap.x);
  knobS.setAttribute("d", lineOnTop([D.knobS[0] + Math.sin(ad) * 1, D.knobS[1] - Math.cos(ad) * 1], [D.knobS[0] + Math.sin(ad) * 3.8, D.knobS[1] - Math.cos(ad) * 3.8], D.knobTop + 0.4, D.P));
  const [ex, ez] = D.eccentric;
  eccentric.setAttribute("d", sideRing([ex + 0.05, 2.9 * Math.cos(state.phase), ez + bob + 2.9 * Math.sin(state.phase)], 1.05, "x", D.P, 14));
  stage.style.setProperty("--rt-lamp", state.lamp.toFixed(3));
  drawFallback();
}

function drawGl() {
  if (!lit || !paperCanvas.clientWidth || !paperCanvas.clientHeight) return;
  if (state.lamp <= 0 && !pale) {
    paperLayer.clear();
    waterLayer.clear();
    return;
  }
  packHistory();
  const values = {
    uS1: [D.xs, -gap.x / 2],
    uS2: [D.xs, gap.x / 2],
    uPhase: state.phase,
    uHist: [(state.clock - state.pushed) / D.histDt, D.histDt],
    uIG: 1 / (model.group * 1000),
    uKNow: model.kMm,
    uStep: state.step,
    uLight: state.lamp,
  };
  paperLayer.draw(values, 0);
  if (state.lamp > 0) waterLayer.draw(values, 0);
  else waterLayer.clear();
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (touring && !calm) {
    tourClock += dt;
    if (tourClock >= 0) {
      const aim = tourAt(tourClock);
      state.tf = aim.f;
      state.td = aim.d;
    }
  }
  const before = [freq.x, gap.x];
  settle(freq, state.tf, dt, 0.625, calm);
  settle(gap, state.td, dt, 0.4, calm);
  if (lit) {
    state.lampClock += dt;
    state.lamp = calm ? 1 : smooth(0, 1, (state.lampClock - 0.15) / 0.9);
  }
  if (!calm) state.phase = (state.phase + dt * TAU * D.beat) % TAU;
  state.step = calm ? 0 : dt;
  const changed = dirty || before[0] !== freq.x || before[1] !== gap.x;
  if (changed) model = stateOf(freq.x, gap.x, D.optics);
  remember(dt, calm);
  if (changed || !calm) {
    drawSvg();
    drawGl();
    if (readout.textContent !== readoutOf(model)) readout.textContent = readoutOf(model);
  }
  dirty = false;
  const settled = calm && freq.x === state.tf && gap.x === state.td && (!lit || state.lamp === 1);
  frame = visible && !settled ? requestAnimationFrame(tick) : 0;
}

function run() {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}

function hold() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (still.matches) return;
    touring = true;
    tourClock = -0.001;
    tourFrom = { f: freq.x, d: gap.x };
    run();
  }, 3600);
}

function steer(f, d) {
  if (touring) {
    freq.v = 0;
    gap.v = 0;
  }
  state.tf = clampTo(f, FR[0], FR[1]);
  state.td = clampTo(d, SR[0], SR[1]);
  dirty = true;
  hold();
  announce();
  run();
}

new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();
  },
  { rootMargin: "120px 0px" },
).observe(stage);

const HIT = 34;
let drag = null;
function knobAt(event) {
  const box = stage.getBoundingClientRect();
  const scale = box.width / D.W;
  const px = event.clientX - box.left;
  const py = event.clientY - box.top;
  let best = null;
  for (const [spot, range, value] of [[D.knobF, FR, freq.x], [D.knobS, SR, gap.x]]) {
    const [sx, sy] = iso([spot[0], spot[1], D.knobTop], D.P);
    const dist = Math.hypot(px - sx * scale, py - sy * scale);
    if (dist <= HIT && (!best || dist < best.dist)) best = { range, value, dist };
  }
  return best;
}

stage.addEventListener("pointerdown", (event) => {
  const hit = knobAt(event);
  if (!hit) return;
  drag = { range: hit.range, from: event.clientY, value: hit.value };
  stage.setPointerCapture(event.pointerId);
  event.preventDefault();
});

stage.addEventListener("pointermove", (event) => {
  if (!drag || !event.buttons) return;
  const [lo, hi] = drag.range;
  const frac = clampTo((drag.value - lo) / (hi - lo) + (drag.from - event.clientY) / 150, 0, 1);
  const v = lo + frac * (hi - lo);
  if (drag.range === FR) steer(v, touring ? gap.x : state.td);
  else steer(touring ? freq.x : state.tf, v);
});

const endDrag = () => {
  drag = null;
};
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);

stage.addEventListener("keydown", (event) => {
  const big = event.shiftKey;
  let f = touring ? freq.x : state.tf;
  let d = touring ? gap.x : state.td;
  if (event.key === "ArrowRight") f += big ? 2 : 0.5;
  else if (event.key === "ArrowLeft") f -= big ? 2 : 0.5;
  else if (event.key === "ArrowUp") d += big ? 10 : 2;
  else if (event.key === "ArrowDown") d -= big ? 10 : 2;
  else if (event.key === "Home") f = FR[0];
  else if (event.key === "End") f = FR[1];
  else return;
  event.preventDefault();
  steer(f, d);
});

still.addEventListener("change", () => {
  touring = !still.matches;
  dirty = true;
  run();
});

if (matchMedia("(hover: none)").matches) {
  const hint = root.querySelector('[data-corner="hint"]');
  if (hint) hint.textContent = "Drag the knobs · arrows set f and spacing";
}
window.addEventListener("resize", () => {
  dirty = true;
  run();
});
stage.addEventListener("focus", () => {
  said.textContent = wordsOf(model);
});
for (let slot = 0; slot < HIST; slot++) record(slot);
drawSvg();
drawGl();
readout.textContent = readoutOf(model);
</script></body></html>
